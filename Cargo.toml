[workspace]
resolver = "3"
members = [
    "crates/graphoxide-core",
    "crates/graphoxide-index-runtime",
    "crates/graphoxide-extract",
    "crates/graphoxide-graph",
    "crates/graphoxide-query",
    "crates/graphoxide-export",
    "crates/graphoxide-mcp",
    "crates/graphoxide-cli",
    "crates/graphoxide-skillgen",
]

[workspace.package]
version = "0.10.5"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/cgaspard/graphoxide"

[workspace.dependencies]
# intra-workspace
graphoxide-core = { path = "crates/graphoxide-core" }
graphoxide-index-runtime = { path = "crates/graphoxide-index-runtime" }
graphoxide-extract = { path = "crates/graphoxide-extract" }
graphoxide-graph = { path = "crates/graphoxide-graph" }
graphoxide-query = { path = "crates/graphoxide-query" }
graphoxide-export = { path = "crates/graphoxide-export" }
graphoxide-mcp = { path = "crates/graphoxide-mcp" }

# shared external deps
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
petgraph = "0.8"
rayon = "1.10"
ignore = "0.4"          # gitignore-aware parallel walker (ripgrep's)
rapidfuzz = "0.5"       # same algorithms as the Python rapidfuzz dep
clap = { version = "4", features = ["derive"] }
ctrlc = "3.5.2"
tracing = "0.1"
tracing-subscriber = "0.3"
tree-sitter = "0.25"
unicode-normalization = "0.1"
unicode-casefold = "0.2"
rand = "0.10"
network_partitions = { git = "https://github.com/graspologic-org/graspologic-native.git", rev = "773181488b4e5b81925e302b972b294fd51f61a4", features = ["petgraph"] }
md-5 = "0.10"
sha2 = "0.10"
hex = "0.4"
regex = "1"
rmcp = { version = "3.1", features = ["server", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "net", "time", "sync"] }
notify = "8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
# The opt-in vision path uses base64's runtime-dispatched AVX2/NEON engine and
# falls back to scalar on CPUs without either feature.
base64 = "0.23"
simdutf8 = "0.1.5"
toml = "0.9"
postgres = "0.19.14"

[profile.release]
lto = "thin"
codegen-units = 1
