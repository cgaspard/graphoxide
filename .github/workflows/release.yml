name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  actions: read
  contents: read

jobs:
  prepare:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      channel: ${{ steps.version.outputs.channel }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require successful CI for the tagged commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DEFAULT_BRANCH="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)"
          RUNS_URL="repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&per_page=20"

          for attempt in $(seq 1 120); do
            RESPONSE="$(gh api "$RUNS_URL")"
            mapfile -t CI_RUN < <(
              jq -r --arg branch "$DEFAULT_BRANCH" '
                [.workflow_runs[] | select(.head_branch == $branch)]
                | sort_by(.run_number, .run_attempt)
                | last
                | if . == null then empty else .id, .status, (.conclusion // ""), .html_url end
              ' <<<"$RESPONSE"
            )

            if [ "${#CI_RUN[@]}" -eq 0 ]; then
              echo "Waiting for CI to start for ${GITHUB_SHA} on ${DEFAULT_BRANCH} (${attempt}/120)"
            elif [ "${CI_RUN[1]}" = "completed" ]; then
              if [ "${CI_RUN[2]}" = "success" ]; then
                echo "Verified successful exact-SHA CI run: ${CI_RUN[3]}"
                exit 0
              fi
              echo "::error::Exact-SHA CI concluded ${CI_RUN[2]}: ${CI_RUN[3]}"
              exit 1
            else
              echo "Waiting for exact-SHA CI run ${CI_RUN[0]} (${CI_RUN[1]}, ${attempt}/120): ${CI_RUN[3]}"
            fi
            sleep 15
          done

          echo "::error::Timed out waiting for exact-SHA CI on ${GITHUB_SHA}"
          exit 1

      - name: Resolve version and Marketplace channel
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          MINOR="$(printf '%s' "$VERSION" | cut -d. -f2 | cut -d- -f1)"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $TAG is not a supported semantic version"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "channel=none" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          elif [ $((MINOR % 2)) -eq 1 ]; then
            echo "channel=prerelease" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify synchronized versions and component release notes
        run: node scripts/render-release-notes.mjs "${{ steps.version.outputs.version }}" --check

      - name: Validate bundled agent artifacts
        run: node scripts/agent-artifacts.mjs --check

      - name: Render combined GitHub release notes
        run: node scripts/render-release-notes.mjs "${{ steps.version.outputs.version }}" > release-body.md

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-body.md
          if-no-files-found: error

  build:
    name: ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-14
            rust_target: aarch64-apple-darwin
            vscode_target: darwin-arm64
            executable: graphoxide
            archive_extension: tar.gz
          - name: macOS x64
            os: macos-15-intel
            rust_target: x86_64-apple-darwin
            vscode_target: darwin-x64
            executable: graphoxide
            archive_extension: tar.gz
          - name: Linux x64
            os: ubuntu-latest
            rust_target: x86_64-unknown-linux-musl
            vscode_target: linux-x64
            executable: graphoxide
            archive_extension: tar.gz
          - name: Linux arm64
            os: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
            vscode_target: linux-arm64
            executable: graphoxide
            archive_extension: tar.gz
          - name: Windows x64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            vscode_target: win32-x64
            executable: graphoxide.exe
            archive_extension: zip
          - name: Windows arm64
            os: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
            vscode_target: win32-arm64
            executable: graphoxide.exe
            archive_extension: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.rust_target }}

      - name: Ensure exact release target is installed
        shell: bash
        run: |
          rustup target add --toolchain 1.95.0 "${{ matrix.rust_target }}"
          rustup target list --installed --toolchain 1.95.0 | grep -Fx -- "${{ matrix.rust_target }}"

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.rust_target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install musl build tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils file musl-tools

      - name: Build standalone Graphoxide
        run: cargo build --release --locked --target ${{ matrix.rust_target }} --bin graphoxide

      - name: Verify Linux executable is statically linked
        if: runner.os == 'Linux'
        shell: bash
        run: |
          BINARY="target/${{ matrix.rust_target }}/release/${{ matrix.executable }}"
          file "$BINARY"
          if readelf --program-headers "$BINARY" | grep --quiet 'Requesting program interpreter'; then
            echo "::error::$BINARY contains a dynamic ELF interpreter"
            exit 1
          fi
          if readelf --dynamic "$BINARY" 2>/dev/null | grep --quiet '(NEEDED)'; then
            echo "::error::$BINARY contains dynamically linked library dependencies"
            exit 1
          fi

      - name: Install extension dependencies
        run: npm ci
        working-directory: editors/vscode

      - name: Validate extension
        run: npm run check
        working-directory: editors/vscode

      - name: Package target-specific VSIX with bundled Graphoxide
        working-directory: editors/vscode
        run: >-
          node scripts/package.mjs
          --target ${{ matrix.vscode_target }}
          --binary "${{ github.workspace }}/target/${{ matrix.rust_target }}/release/${{ matrix.executable }}"
          --out "${{ github.workspace }}/release-assets/graphoxide-vscode-${{ matrix.vscode_target }}-${{ needs.prepare.outputs.version }}.vsix"
          ${{ needs.prepare.outputs.channel == 'prerelease' && '--pre-release' || '' }}

      - name: Package standalone Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          BUNDLE_NAME="graphoxide-${{ matrix.vscode_target }}-${{ needs.prepare.outputs.version }}"
          BUNDLE_ROOT="${RUNNER_TEMP}/${BUNDLE_NAME}"
          mkdir -p "$BUNDLE_ROOT"
          cp "target/${{ matrix.rust_target }}/release/${{ matrix.executable }}" "$BUNDLE_ROOT/graphoxide"
          chmod 755 "$BUNDLE_ROOT/graphoxide"
          cp LICENSE LICENSE-MIT NOTICE README.md THIRD_PARTY_LICENSES.html "$BUNDLE_ROOT/"
          node scripts/agent-artifacts.mjs --out "$BUNDLE_ROOT/agent-assets"
          tar -czf "release-assets/${BUNDLE_NAME}.tar.gz" -C "$RUNNER_TEMP" "$BUNDLE_NAME"
          cp "release-assets/${BUNDLE_NAME}.tar.gz" "release-assets/graphoxide-${{ matrix.vscode_target }}.tar.gz"

      - name: Package standalone Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundleName = 'graphoxide-${{ matrix.vscode_target }}-${{ needs.prepare.outputs.version }}'
          $bundleRoot = Join-Path $env:RUNNER_TEMP $bundleName
          New-Item -ItemType Directory -Path $bundleRoot -Force | Out-Null
          Copy-Item -LiteralPath 'target/${{ matrix.rust_target }}/release/${{ matrix.executable }}' -Destination (Join-Path $bundleRoot 'graphoxide.exe')
          Copy-Item -LiteralPath LICENSE, LICENSE-MIT, NOTICE, README.md, THIRD_PARTY_LICENSES.html -Destination $bundleRoot
          $agentAssets = Join-Path $bundleRoot 'agent-assets'
          node scripts/agent-artifacts.mjs --out $agentAssets
          if ($LASTEXITCODE -ne 0) { throw 'Agent artifact staging failed' }
          $versionedArchive = 'release-assets/{0}.zip' -f $bundleName
          Compress-Archive -LiteralPath $bundleRoot -DestinationPath $versionedArchive -CompressionLevel Optimal
          Copy-Item -LiteralPath $versionedArchive -Destination 'release-assets/graphoxide-${{ matrix.vscode_target }}.zip'

      - name: Create stable-name VSIX mirror
        run: >-
          node -e "require('node:fs').copyFileSync(process.argv[1], process.argv[2])"
          "release-assets/graphoxide-vscode-${{ matrix.vscode_target }}-${{ needs.prepare.outputs.version }}.vsix"
          "release-assets/graphoxide-vscode-${{ matrix.vscode_target }}.vsix"

      - uses: actions/upload-artifact@v4
        with:
          name: graphoxide-${{ matrix.vscode_target }}
          path: release-assets/*
          if-no-files-found: error

  marketplace:
    name: Publish VS Code Marketplace
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install extension publishing dependencies
        run: npm ci
        working-directory: editors/vscode

      - uses: actions/download-artifact@v4
        with:
          pattern: graphoxide-*
          path: release-assets
          merge-multiple: true

      - name: Require every target-specific VSIX before publication
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          targets=(darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64 win32-arm64)
          for target in "${targets[@]}"; do
            test -f "release-assets/graphoxide-vscode-${target}-${VERSION}.vsix"
          done
          test "$(find release-assets -maxdepth 1 -type f -name "graphoxide-vscode-*-${VERSION}.vsix" | wc -l)" -eq 6

      - name: Publish all targets to VS Code Marketplace (${{ needs.prepare.outputs.channel }})
        if: needs.prepare.outputs.channel != 'none'
        shell: bash
        working-directory: editors/vscode
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          targets=(darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64 win32-arm64)
          channel_args=()
          if [ "$CHANNEL" = "prerelease" ]; then
            channel_args+=(--pre-release)
          fi
          for target in "${targets[@]}"; do
            node node_modules/@vscode/vsce/vsce publish \
              --skip-duplicate \
              "${channel_args[@]}" \
              --packagePath "${GITHUB_WORKSPACE}/release-assets/graphoxide-vscode-${target}-${VERSION}.vsix"
          done

  publish:
    name: Publish GitHub release
    needs: [prepare, build, marketplace]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: graphoxide-*
          path: release-assets
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Generate SHA-256 checksums
        shell: bash
        working-directory: release-assets
        run: |
          mapfile -t assets < <(find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort)
          test "${#assets[@]}" -eq 24
          sha256sum "${assets[@]}" > SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 24

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-assets/*

      - name: Create GitHub release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Graphoxide ${{ needs.prepare.outputs.tag }}
          body_path: release-body.md
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: release-assets/*
