name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: graphoxide-linux-x86_64.tar.gz
          - name: macOS arm64
            os: macos-14
            target: aarch64-apple-darwin
            archive: graphoxide-macos-arm64.tar.gz
          - name: macOS x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            archive: graphoxide-macos-x86_64.tar.gz
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: graphoxide-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: cargo build --release --locked --target ${{ matrix.target }} --bin graphoxide
      - run: npm ci
        working-directory: editors/vscode
      - run: npm run check
        working-directory: editors/vscode
      - run: npm run package
        working-directory: editors/vscode
      - name: Package Unix artifact
        if: runner.os != 'Windows'
        run: tar -czf "${{ matrix.archive }}" -C "target/${{ matrix.target }}/release" graphoxide -C "$GITHUB_WORKSPACE" LICENSE NOTICE LICENSE-MIT README.md
      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "target/${{ matrix.target }}/release/graphoxide.exe", LICENSE, NOTICE, LICENSE-MIT, README.md -DestinationPath "${{ matrix.archive }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ matrix.archive }}
            editors/vscode/*.vsix
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release and upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" artifacts/* --repo "${GITHUB_REPOSITORY}" --generate-notes --verify-tag
