name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  qualification:
    name: Universal indexing qualification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (2026-08-10)
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: qualification
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Repository regression tests
        run: >-
          node --test
          scripts/agent-artifacts.test.mjs
          scripts/benchmark-graph-build.test.mjs
          scripts/qualify-universal-indexing.test.mjs
          scripts/workflow-dependencies.test.mjs
      - run: cargo build --release --locked --bin graphoxide
      - name: Stage single-link qualification binary
        id: qualification_binary
        shell: bash
        run: |
          source_binary="target/release/graphoxide"
          staged_parent="${RUNNER_TEMP}/graphoxide-qualification-binary-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 0700 -- "${staged_parent}"
          staged_parent="$(realpath -- "${staged_parent}")"
          test -d "${staged_parent}" && test ! -L "${staged_parent}"
          test "$(stat -c '%u' "${staged_parent}")" -eq "$(id -u)"
          test "$(stat -c '%a' "${staged_parent}")" = 700
          staged_parent_identity="$(stat -c '%d:%i' "${staged_parent}")"
          test "$(stat -c '%F' "${source_binary}")" = "regular file"
          test "$(stat -c '%u' "${source_binary}")" -eq "$(id -u)"
          test -x "${source_binary}"
          source_identity="$(stat -c '%d:%i' "${source_binary}")"
          staged_binary="${staged_parent}/graphoxide"
          install -m 0700 "${source_binary}" "${staged_binary}"
          staged_binary="$(realpath -- "${staged_binary}")"
          test "${staged_binary}" = "${staged_parent}/graphoxide"
          test "$(stat -c '%F' "${staged_binary}")" = "regular file"
          test -x "${staged_binary}"
          test "$(stat -c '%h' "${staged_binary}")" -eq 1
          test "$(stat -c '%u' "${staged_binary}")" -eq "$(id -u)"
          test "$(stat -c '%a' "${staged_binary}")" = 700
          test "$(stat -c '%d:%i' "${staged_binary}")" != "${source_identity}"
          cmp -s "${source_binary}" "${staged_binary}"
          test "$(stat -c '%d:%i' "${source_binary}")" = "${source_identity}"
          test "$(stat -c '%d:%i' "${staged_parent}")" = "${staged_parent_identity}"
          test "$(stat -c '%u' "${staged_parent}")" -eq "$(id -u)"
          test "$(stat -c '%a' "${staged_parent}")" = 700
          STAGED_BINARY="${staged_binary}" node --input-type=module -e \
            'if (/[\u0000-\u001f\u007f]/u.test(process.env.STAGED_BINARY ?? "")) throw new Error("staged binary path contains a control byte")'
          printf '%s\n' "path=${staged_binary}" >> "${GITHUB_OUTPUT}"
      - name: Run small deterministic qualification
        env:
          STAGED_BINARY: ${{ steps.qualification_binary.outputs.path }}
        run: |
          report_parent="${RUNNER_TEMP}/graphoxide-qualification-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 0700 -- "${report_parent}"
          report_parent="$(realpath -- "${report_parent}")"
          node scripts/qualify-universal-indexing.mjs \
            --profile ci-mixed-v1 \
            --binary "${STAGED_BINARY}" \
            --report "${report_parent}/universal-qualification.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: universal-indexing-qualification
          path: ${{ runner.temp }}/graphoxide-qualification-${{ github.run_id }}-${{ github.run_attempt }}/universal-qualification.json
          if-no-files-found: error

  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (2026-08-10)
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast --locked
      - run: cargo build --release --workspace --locked

  parity:
    name: Graphify differential parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Graphify-Labs/graphify
          ref: 00efd6e7969837ae4a9f11d8d504dcd3b20b09df
          path: upstream
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (2026-08-10)
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: parity
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          prune-cache: true
      - run: npm ci
        working-directory: editors/vscode
      - run: python3 -m unittest discover -s parity/tests -p 'test_*.py'
      - run: >-
          python3 -m unittest discover
          -s parity/differential
          -p 'test_*.py'
      - run: >-
          python3 parity/verify.py check
          --require-complete
          --upstream-checkout upstream
      - run: >-
          python3 -m parity.differential.corpus_suite
          --build
          --work-dir "${RUNNER_TEMP}/graphoxide-corpus-suite"
          --output "${RUNNER_TEMP}/graphoxide-corpus-suite.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: graphify-differential-report
          path: |
            ${{ runner.temp }}/graphoxide-corpus-suite.json
            ${{ runner.temp }}/graphoxide-corpus-suite/**
          if-no-files-found: ignore

  vscode:
    name: VS Code extension and E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (2026-08-10)
        with:
          toolchain: "1.97.1"
      - run: npm ci
      - run: npm run check
      - run: npm run test:visualizer:browser
        env:
          GRAPHOXIDE_VISUALIZER_ARTIFACTS: ${{ runner.temp }}/graphoxide-visualizer
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: graphoxide-visualizer-browser
          path: ${{ runner.temp }}/graphoxide-visualizer
          if-no-files-found: ignore
      - run: cargo build --release --locked --bin graphoxide
        working-directory: ${{ github.workspace }}
      - run: xvfb-run -a npm run test:e2e
      - run: npm run package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: graphoxide-vscode
          path: editors/vscode/*.vsix
          if-no-files-found: error

  website:
    name: Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: node scripts/render-release-notes.mjs --current --check
      - run: node --check website/app.js
      - run: node website/scripts/validate.mjs

  licenses:
    name: Dependency licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (2026-08-10)
        with:
          toolchain: "1.97.1"
      - uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: cargo-about@0.9.1
      - run: cargo about generate --workspace --locked --fail --output-file /tmp/THIRD_PARTY_LICENSES.html about.hbs
      - run: diff -u THIRD_PARTY_LICENSES.html /tmp/THIRD_PARTY_LICENSES.html
