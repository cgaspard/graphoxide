version: 0.13.0
date: 2026-08-29
highlights:
  - Graphoxide now builds an incremental, provenance-bound LLM wiki without copying raw source files into the wiki or its Git-tracked registry. A new `registry` command group manages a metadata-only, Git-trackable source registry (logical origins, normalized relative paths, content digests, lifecycle state, and append-only secret-free model-run records), while a new `wiki` command group plans, drafts, validates, renders, and materializes deterministic graph-derived Markdown with `llms.txt`, a manifest, and a lexical search index.
  - Seven new read-only MCP tools (wiki_status, wiki_freshness, wiki_search, wiki_get_page, wiki_get_evidence, wiki_validate_draft, wiki_attest_review) expose wiki state, freshness, search, page and evidence retrieval, draft validation, and deterministic review attestations to AI agents.
added:
  - `graphoxide registry init` creates an empty, Git-trackable Registry v1 tree; `registry origin` (add/bind/list/remove) manages logical origins whose local filesystem locations are never stored in Git.
  - `graphoxide registry discover` lists safe untracked files below a bound origin with deterministic family selection and optional `--accept-discovered`; `registry scan` (modes `changed`/`verify`) performs cheap identity checks before hashing; `registry publish` commits local scan observations as a new capture; `registry validate` checks tree invariants.
  - `graphoxide registry freshness` reads an optional `policies/freshness.json` (model stage, max age, source priorities) and queues only missing, failed/retryable, or expired model work for the active capture's latest immutable run; it never queues while an extract is pending or a scanned source is missing. `registry list --json` includes the active capture's `last_runs` (actor, model, provider request ID, integer usage counters).
  - `graphoxide registry run record` appends a secret-free immutable record for an LLM or agent run: actor/agent/model, provider request ID, profile/prompt/evidence digests, token/cost/latency/retry counters, and outcome—never prompts or credentials.
  - `graphoxide registry` lifecycle commands: `retire`, `restore`, `rename`, `resolve-source`, and `list` for deterministic capture management.
  - `graphoxide wiki plan` proposes a reviewer-owned canonical wiki plan from graph metadata; it never overwrites a reviewed plan and writes a new `.proposed.json` file. Supports OpenAI-compatible, Anthropic Messages, native Ollama, and MCP agent providers via versioned secret-free provider profiles, and can append a validated `wiki-plan` run record to a bound Registry v1 tree.
  - `graphoxide wiki draft` creates catalog-cited, local-Ollama Markdown drafts in a new directory with immutable frontmatter and evidence-block references; supports canonical article synthesis from graph evidence and per-page scope selection (source, community, topic).
  - `graphoxide wiki render` renders deterministic graph-derived Markdown into a new directory; canonical rendering reads only graph, catalog metadata, and the reviewed plan—never raw source files. Output can be bound to active captures in a catalog directory.
  - `graphoxide wiki materialize` publishes a graph-only `source-ready` page per capture as soon as it is complete, then atomically advances `wiki-manifest.json` and reconciles navigation. Accepts a clean Git checkout of the Registry v1 tree, an exact commit object ID, an optional validated canonical draft tree (only evidence-bound article prose is adopted), an optional pinned freshness policy, and a model-work budget. `llms.txt`, manifest, `search.json`, source/reference pages, and the change ledger are deterministic; pages expose `source-ready`, `draft-ready`, `reviewed-ready`, `stale`, or `historical` state.
  - `graphoxide wiki check` validates wiki pages and requires the generated `llms.txt` to be current; can validate page citations against a catalog directory, graph catalog annotations, and an exact reviewed canonical plan render.
  - `graphoxide wiki index` generates the deterministic `llms.txt` file defined by the wiki config.
  - `graphoxide wiki openapi validate` and `graphoxide wiki openapi fetch` support private, manifest-driven, read-only OpenAPI contracts with a pinned specification digest, HTTPS host allowlist, secret environment-reference, and GET/HEAD operation allowlist; responses are bounded and only metadata and a response digest are emitted.
  - New `graphoxide.extract --catalog` / `--apply-catalog` flags accept a read-only PostgreSQL catalog directory and apply validated catalog metadata as post-build graph annotations.
  - New `graphoxide.extract --registry-tree` flag binds one local origin from a validated Registry v1 tree; registry-bound updates use the isolated executor so capture lifecycle is independent of the main build.
  - Seven new MCP tools over both stdio and Streamable HTTP transports: `wiki_status` (manifest state counts and non-ready items), `wiki_freshness` (stale and historical items with last-run summaries), `wiki_search` (bounded lexical search over `search.json`), `wiki_get_page` (bounded page content by relative path), `wiki_get_evidence` (evidence-block references for a page), `wiki_validate_draft` (structural validation of a draft tree), and `wiki_attest_review` (deterministic review-attestation JSON artifact; the caller must submit it through Git review).
  - Rust workspace gains a `rusqlite 0.32` dependency (bundled SQLite) for the local per-user Registry state cache; the SQLite cache stores the real origin binding and scan observations and is never committed to the shared registry.
  - `scripts/benchmark-graph-build.mjs` gains a catalog-wiki profile with dedicated unit tests; `scripts/verify.mjs` honors an optional `GRAPHOXIDE_TEST_CONCURRENCY` environment variable for the VS Code extension test runner.
changed:
  - The VS Code extension's bundled CLI now includes the `wiki` and `registry` command groups and the seven new MCP wiki tools; a new `graphoxide.registryBinding` workspace setting (`{ tree, origin }`) optionally appends a Registry v1 binding to extract, index, update, and watch commands.
  - Graph construction, clustering, and deduplication paths gained catalog-aware annotation handling so that validated catalog metadata participates in node and edge identity without altering the structural graph.
  - The extraction engine now emits a catalog metadata sidecar during extraction when a PostgreSQL catalog directory is provided, and the structured extractor gained taxonomy and registry-state modules.
removed: []
