version: 0.10.0
date: 2026-08-09
highlights:
  - Expand bounded universal indexing across semantic diagrams, recursive archives, documents, validated runtime reuse, and explicitly consented enrichment.
added:
  - Add deterministic semantic Graphviz DOT extraction for graph and subgraph hierarchy, defaults, chained edges, ports, strict graphs, and bounded recovery diagnostics.
  - Recursively index supported members of ZIP, TAR, and single-stream GZIP inputs while preserving stable container provenance without filesystem extraction.
  - Add conservative bounded structural parsing for classic-xref PDF documents and for DOCX, XLSX, PPTX, ODT, ODS, ODP, and EPUB packages with page, part, and relationship provenance.
  - Add the CLI-only graphoxide enrich command with an explicit transcript-summary profile, provider configuration, credential boundary, and consent token; default indexing, update, and watch never invoke it.
  - Add content-addressed cold, warm, incremental, Linux controlled-OS-cold, and optional acknowledged exact 70 GiB qualification tooling with bounded raw evidence and no timing thresholds.
changed:
  - Reuse validated persistent isolated-runtime cache entries when source identity, content, extractor policy, and runtime options match, while keeping accepted graph and coverage output deterministic.
  - Emit opt-in runtime-report schema v2 with source I/O, parser work, cache-transfer totals, reserved admission-credit peaks, and process RSS evidence while preserving unchanged default CLI output and the existing telemetry v1 API.
fixed:
  - Preserve nested container, page, package-part, and relationship provenance through graph construction, deduplication, clustering, caching, and incremental updates.
  - Treat corrupt, unsafe, stale, or incomplete cache entries as safe misses and repair eligible cache state without changing accepted graph bytes.
  - Keep encrypted, active, linked, malformed, unsupported, and over-limit archive or document content inert or rejected without executing payloads or extracting them to disk.
removed: []
