version: 0.10.10
date: 2026-08-22
highlights:
  - PDF extraction now handles a large class of real-world documents that were previously rejected or under-extracted: cross-reference streams with self-referencing entries, multi-megabyte files, tagged (structured) PDFs, JPEG/image streams, and ToUnicode CMaps that omit the optional /Type key.
  - Exporting to a bare filename (no directory component) no longer fails.
added: []
changed: []
fixed:
  - PDF parsing no longer rejects documents whose cross-reference stream contains an entry for the xref stream object itself; that self-referencing entry is now skipped.
  - PDF active-content (unsafe-name) rejection is now scoped to executable names, so legitimate documents that contain those tokens in structural positions are no longer rejected.
  - Multi-megabyte PDFs are now admitted through the parser's own scratch budget proof instead of being rejected for exceeding a fixed arena limit.
  - ToUnicode CMaps that omit the optional /Type /CMap key are now collected, so text encoded through those CMaps is decoded instead of dropped. Counted CMap section headers and bfrange ranges now parse at the correct code width.
  - Undecoded (non-Flate) PDF streams such as JPEG image XObjects are now kept inert instead of aborting the whole document; they are decoded only when actually needed.
  - Balanced content-stream dictionaries used by tagged (structured) PDFs are now skipped instead of being treated as malformed content.
  - Atomic writes to a bare-filename destination (no directory component) no longer fail with "No such file or directory"; the temp file and directory sync now target the current directory.
  - graphoxide-core's shared dependencies (serde, serde_json, petgraph, unicode-normalization, unicode-casefold, reqwest, sha2, hex, chrono) are now declared for all targets instead of unix-only, so the Windows release builds compile.
removed: []
