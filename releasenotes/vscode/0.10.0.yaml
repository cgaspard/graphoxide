version: 0.10.0
date: 2026-08-09
highlights:
  - Bundle Graphoxide 0.10.0 with bounded semantic DOT, recursive archive, PDF, and document-package indexing plus validated local runtime caching.
added:
  - Include semantic Graphviz DOT extraction and bounded provenance for supported ZIP, TAR, GZIP, PDF, DOCX, XLSX, PPTX, ODT, ODS, ODP, and EPUB inputs in every platform-specific bundled executable.
  - Include graphoxide enrich in the bundled executable as a CLI-only explicit opt-in; the extension does not select enrichment profiles, collect consent, or initiate provider requests.
changed:
  - Allow eligible extension-managed builds to reuse validated local parser results while keeping default indexing offline and accepted graph output deterministic.
  - Qualify the bundled indexing path in repository CI with a content-addressed cold, warm, and incremental corpus; controlled cache operations and large-volume qualification remain operator tooling rather than extension features.
fixed:
  - Preserve nested container, page, package-part, and relationship provenance in bundled graph output and avoid unsafe identity collisions during graph construction and incremental updates.
  - Reject unsafe, encrypted, active, malformed, or over-limit archive and document structures without executing or extracting their payloads.
removed: []
