version: 0.1.0
date: 2026-08-02
highlights:
  - First Graphoxide for VS Code release, with a native architecture explorer and fully managed graph lifecycle inside the IDE.
  - Every Marketplace package includes the standalone Graphoxide executable for its exact operating system and architecture.
added:
  - Activity Bar graph explorer, interactive graph canvas, communities, architectural hubs, source navigation, CodeLens, queries, paths, impact analysis, reports, and exports.
  - Trust-aware first-open onboarding with managed extraction and continuous-watch, update-on-save, or manual freshness policies.
  - Native VS Code MCP registration plus project- and user-level installers for detected Claude Code, Codex, and OpenCode clients.
  - A sample Cartograph workspace and Extension Development Host launcher for full-system verification.
  - Platform-specific VSIX packages for macOS, Linux, and Windows on x64 and arm64.
changed:
  - Interactive graphs open in the active editor group by default, with a separate command for intentional side-by-side viewing.
  - Release packages record the bundled CLI version, target, and executable name for provenance.
fixed:
  - Managed save and startup refreshes accept intentional graph reductions.
  - Extension-host tests cover MCP initialization guidance, overview and filtered-call tools, managed extraction, installers, save updates, watch updates, and graph placement.
removed: []
