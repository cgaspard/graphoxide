version: 0.11.0
date: 2026-08-24
highlights:
  - The bundled CLI now indexes SQLite databases: it reads the file format directly (no SQL executed) and shows tables, views, indexes, columns, and foreign-key relationships in your graph.
  - Nested archives are now extracted through four more codecs: BZIP2, XZ, Zstandard, and LZ4.
added:
  - The bundled graphoxide CLI now indexes .db, .sqlite, and .sqlite3 files, producing table, view, index, trigger, and column nodes plus foreign-key references, so database schemas appear in the graph alongside source code.
  - The bundled graphoxide CLI now decodes BZIP2, XZ, Zstandard, and LZ4 archives during recursive indexing, so files and directories nested inside them are extracted under the same bounded limits as ZIP, GZIP, and TAR.
changed:
  - The bundled graphoxide CLI now uses the bzip2-sys backend for BZIP2 decoding so dependency licensing resolves cleanly.
removed: []
