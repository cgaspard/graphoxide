[package]
name = "graphoxide-extract"
description = "File detection + tree-sitter extraction engine (nodes/edges per file)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
graphoxide-core.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
rayon.workspace = true
ignore.workspace = true
tracing.workspace = true
tree-sitter.workspace = true
md-5.workspace = true
sha2.workspace = true
sha1 = "0.10"
hex.workspace = true
regex.workspace = true
unicode-normalization.workspace = true
quick-xml = "0.38"
zip = { version = "8.2", default-features = false, features = ["deflate"] }
reqwest.workspace = true
base64.workspace = true
pdf-extract.workspace = true
toml.workspace = true
postgres.workspace = true

# Starter grammar set (tier 1). More are added per HANDOFF.md § "Language matrix".
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-bash = "0.23"
tree-sitter-json = "0.23"
tree-sitter-swift = "0.7.3"

[dev-dependencies]
graphoxide-graph.workspace = true
graphoxide-query.workspace = true
filetime = "0.2"
tempfile = "3"
