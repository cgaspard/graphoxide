[package]
name = "graphoxide-cli"
description = "Graphoxide command-line interface"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "graphoxide"
path = "src/main.rs"

[dependencies]
graphoxide-core.workspace = true
graphoxide-extract.workspace = true
graphoxide-index-runtime.workspace = true
graphoxide-graph.workspace = true
graphoxide-query.workspace = true
graphoxide-export.workspace = true
graphoxide-mcp.workspace = true
anyhow.workspace = true
clap.workspace = true
ctrlc.workspace = true
rayon.workspace = true
serde_json.workspace = true
serde.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
notify.workspace = true
ignore.workspace = true
reqwest.workspace = true
sha2.workspace = true
regex.workspace = true
tokio.workspace = true
hex.workspace = true
blake3 = "1"
fs2 = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
filetime = "0.2"
flate2 = "1"
zip = { version = "8.2", default-features = false, features = ["deflate"] }
