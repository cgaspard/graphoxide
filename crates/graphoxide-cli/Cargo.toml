[package]
name = "graphoxide-cli"
description = "Graphoxide command-line interface"
version.workspace = true
edition.workspace = true
license.workspace = true
autotests = false

[[bin]]
name = "graphoxide"
path = "src/main.rs"

[[test]]
name = "knowledgebase_cli"
path = "tests/knowledgebase_cli.rs"

[dependencies]
graphoxide-core.workspace = true
graphoxide-extract.workspace = true
graphoxide-index-runtime.workspace = true
graphoxide-graph.workspace = true
graphoxide-query.workspace = true
graphoxide-export.workspace = true
graphoxide-mcp.workspace = true
anyhow.workspace = true
clap.workspace = true
ctrlc.workspace = true
rayon.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
serde.workspace = true
schemars.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
notify.workspace = true
ignore.workspace = true
reqwest.workspace = true
robotxt.workspace = true
chrono.workspace = true
sha2.workspace = true
base64.workspace = true
regex.workspace = true
rand.workspace = true
tokio.workspace = true
hex.workspace = true
unicode-casefold.workspace = true
unicode-normalization.workspace = true
blake3 = "1"
fs2 = "0.4"
tempfile = "3"
flate2 = "1"
tar = "0.4"
zip = { version = "8.2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
filetime = "0.2"
bzip2.workspace = true
xz2.workspace = true
zstd.workspace = true
lz4_flex.workspace = true
rusqlite.workspace = true
lopdf = { version = "0.44", default-features = false }
