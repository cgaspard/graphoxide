[package]
name = "graphoxide-index-runtime"
description = "Bounded, filesystem-free runtime primitives for Graphoxide indexing"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints.rust]
# `cfg(loom)` is set by `cargo loom` to build the SPSC queue's Loom model tests
# (issue #52). Declare it so the non-loom build does not warn about an
# unexpected cfg.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[dependencies]
blake3 = "1"
crc32fast = "1"
thiserror.workspace = true
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemInformation",
] }

[dev-dependencies]
tempfile = "3"
# Loom model-checks the lock-free SPSC queue's memory-ordering and ownership
# invariants across producer/consumer interleavings (issue #52). It is a
# dev-dependency only; production builds use `std` atomics via `StdSpscAtomic`.
loom = "0.7"
